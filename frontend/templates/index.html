<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salience Agent — Chat</title>
    <meta name="description" content="Chat interface for the Salience Agent routing system powered by LangGraph and Ollama.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>
    <!-- ===== Ambient Background Blobs ===== -->
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- ===== App Shell ===== -->
    <div id="app" class="app-container">

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="url(#logoGrad)" stroke-width="2"/>
                            <path d="M12 6v6l4 2" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
                            <defs>
                                <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24">
                                    <stop stop-color="#a78bfa"/>
                                    <stop offset="1" stop-color="#6366f1"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="logo-text">Salience</span>
                </div>
                <button id="btn-new-chat" class="btn-new-chat" title="New chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            <div class="sidebar-conversations" id="conversation-list">
                <!-- Conversation items rendered by JS -->
            </div>
            <div class="sidebar-footer">
                <div class="connection-status" id="connection-status">
                    <span class="status-dot"></span>
                    <span class="status-text">Ready</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Top Bar -->
            <header class="chat-topbar">
                <button id="btn-toggle-sidebar" class="btn-icon" title="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="topbar-title">
                    <h1 id="chat-title">New Conversation</h1>
                    <span class="topbar-subtitle">Salience Agent · LangGraph · Ollama</span>
                </div>
                <button id="btn-clear-chat" class="btn-icon" title="Clear conversation">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
                    </svg>
                </button>
            </header>

            <!-- Messages Container -->
            <div class="chat-messages" id="chat-messages">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-icon">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="url(#welcomeGrad)" stroke-width="1.5" opacity="0.6"/>
                            <circle cx="12" cy="12" r="5" stroke="url(#welcomeGrad)" stroke-width="1.5"/>
                            <circle cx="12" cy="12" r="1.5" fill="url(#welcomeGrad)"/>
                            <defs>
                                <linearGradient id="welcomeGrad" x1="0" y1="0" x2="24" y2="24">
                                    <stop stop-color="#a78bfa"/>
                                    <stop offset="1" stop-color="#6366f1"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h2>Salience Agent</h2>
                    <p>Ask anything. The Salience Router will determine the best cognitive pathway and stream the results in real-time.</p>
                    <div class="welcome-suggestions">
                        <button class="suggestion-chip" data-prompt="Explain how the default mode network works in the brain">
                            <span class="chip-icon">🧠</span> Default Mode Network
                        </button>
                        <button class="suggestion-chip" data-prompt="What is executive control and how does it relate to decision making?">
                            <span class="chip-icon">⚡</span> Executive Control
                        </button>
                        <button class="suggestion-chip" data-prompt="Compare salience network routing to attention mechanisms in transformers">
                            <span class="chip-icon">🔄</span> Salience vs Attention
                        </button>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <div class="input-wrapper" id="input-wrapper">
                    <textarea
                        id="chat-input"
                        placeholder="Ask the Salience Agent..."
                        rows="1"
                        autofocus
                    ></textarea>
                    <button id="btn-send" class="btn-send" title="Send message" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                    <button id="btn-stop" class="btn-stop hidden" title="Stop generation">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="6" width="12" height="12" rx="2"/>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift + Enter</kbd> for new line</p>
            </div>
        </main>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
