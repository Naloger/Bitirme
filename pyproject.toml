[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langdetect>=1.0.9",
    "nltk>=3.9.4",
    "spacy>=3.8.14",
    "stanza>=1.12.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.14",
    "sqlalchemy>=2.0.49",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "scikit-learn>=1.9.0",
    "scipy-stubs~=1.17.1",
    "numpy>=2.4.5",
    "scipy>=1.17.1",
    "pytest>=9.1.0",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "psycopg2-binary>=2.9.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--ignore=Tests/legacy"

