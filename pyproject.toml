[project]
name = "services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "igraph>=1.0.0",
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    "langdetect>=1.0.9",
    "langgraph>=1.2.0",
    "leidenalg>=0.12.0",
    "networkx>=3.6.1",
    "nltk>=3.9.4",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.95.1",
    "python-louvain>=0.16",
    "requests>=2.34.1",
    "sentence-transformers>=5.5.1",
    "spacy>=3.8.14",
    "stanza>=1.12.0",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.14",
]

