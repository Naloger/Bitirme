<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium admin dashboard and visualizer for local Typesense database engine.">
    <title>Typesense Database Explorer</title>
    
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --sidebar-bg: rgba(17, 19, 25, 0.85);
            --card-bg: rgba(26, 29, 38, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            
            --glow-blue: rgba(59, 130, 246, 0.15);
            --glow-emerald: rgba(16, 185, 129, 0.15);
            
            --sidebar-width: 280px;
            --transition-speed: 0.25s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* --- Scrollbars --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- Layout --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            flex-shrink: 0;
            backdrop-filter: blur(16px);
            z-index: 10;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            position: relative;
            background: radial-gradient(circle at 80% 10%, rgba(99, 102, 241, 0.05), transparent 50%),
                        radial-gradient(circle at 10% 90%, rgba(6, 182, 212, 0.03), transparent 50%);
        }

        /* --- Sidebar Content --- */
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .sidebar-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        .sidebar-header p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .server-status {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }

        .status-label {
            color: var(--text-secondary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-online { color: var(--accent-emerald); }
        .status-online .status-dot { background-color: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
        
        .status-offline { color: var(--accent-rose); }
        .status-offline .status-dot { background-color: var(--accent-rose); box-shadow: 0 0 8px var(--accent-rose); }

        .collections-section {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 16px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            padding-left: 8px;
        }

        .collections-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .collection-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 10px 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all var(--transition-speed);
        }

        .collection-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .collection-btn.active {
            background: rgba(99, 102, 241, 0.08);
            border-color: rgba(99, 102, 241, 0.25);
            color: var(--text-primary);
            box-shadow: inset 0 0 8px rgba(99, 102, 241, 0.05);
        }

        .collection-count {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            padding: 2px 6px;
            border-radius: 10px;
        }

        .collection-btn.active .collection-count {
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent-indigo);
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-speed);
            border: 1px solid transparent;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-hover);
        }

        .btn-danger {
            background: rgba(244, 63, 94, 0.08);
            border-color: rgba(244, 63, 94, 0.2);
            color: var(--accent-rose);
        }

        .btn-danger:hover {
            background: var(--accent-rose);
            color: white;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
        }

        /* --- Header --- */
        .header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
            background: rgba(11, 12, 16, 0.45);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .header-title h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* --- Dashboard Views --- */
        .view-container {
            padding: 40px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        /* --- Cards --- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            transition: all var(--transition-speed);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .card-value {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-meta {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- Schema Section --- */
        .tabs-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            gap: 24px;
            margin-bottom: 24px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            padding: 12px 4px;
            cursor: pointer;
            position: relative;
            transition: color var(--transition-speed);
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--accent-cyan);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* --- Tables --- */
        .table-container {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(22, 24, 30, 0.4);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            color: var(--text-secondary);
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        /* --- Badges --- */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-cyan { background: rgba(6, 182, 212, 0.1); color: var(--accent-cyan); }
        .badge-indigo { background: rgba(99, 102, 241, 0.1); color: var(--accent-indigo); }
        .badge-emerald { background: rgba(16, 185, 129, 0.1); color: var(--accent-emerald); }
        .badge-rose { background: rgba(244, 63, 94, 0.1); color: var(--accent-rose); }
        
        /* --- Code block --- */
        pre {
            background: rgba(15, 17, 23, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            overflow-x: auto;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #d1d5db;
        }

        /* --- Browser Control Box --- */
        .browser-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all var(--transition-speed);
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.15);
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .pagination-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all var(--transition-speed);
        }

        .pagination-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-hover);
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* --- Modal / Slideover for JSON View --- */
        .modal {
            position: fixed;
            top: 0;
            right: 0;
            width: 500px;
            height: 100vh;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
            padding: 40px 24px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
        }

        .modal.open {
            transform: translateX(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            flex-grow: 1;
            overflow-y: auto;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- Empty state / loaders --- */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--text-secondary);
        }

        .empty-state-title {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-state-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .loader {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Typesense</h1>
            <p>Database Explorer</p>
        </div>
        
        <div class="server-status">
            <div class="status-item">
                <span class="status-label">Database Connection:</span>
                <span id="db-status-badge" class="status-badge status-offline">
                    <span class="status-dot"></span>
                    <span id="db-status-text">Disconnected</span>
                </span>
            </div>
            <div class="status-item">
                <span class="status-label">Ollama Host:</span>
                <span id="ollama-status-badge" class="status-badge status-offline">
                    <span class="status-dot"></span>
                    <span id="ollama-status-text">Inactive</span>
                </span>
            </div>
        </div>
        
        <div class="collections-section">
            <h3 class="section-title">Collections</h3>
            <div id="collections-list" class="collections-list">
                <!-- Dynamically filled -->
                <div class="empty-state" style="padding: 16px 0; font-size: 13px;">Loading...</div>
            </div>
        </div>
        
        <div class="sidebar-footer">
            <button onclick="refreshData()" class="btn btn-secondary">
                Refresh Dashboard
            </button>
            <button onclick="showHome()" class="btn btn-secondary">
                View Server Home
            </button>
        </div>
    </div>

    <!-- MAIN PANEL -->
    <div class="main-content">
        <!-- HEADER -->
        <div class="header">
            <div class="header-title">
                <h2 id="view-title">Typesense Engine Overview</h2>
                <p id="view-subtitle">Status, collections, and configurations metadata.</p>
            </div>
            <div class="header-actions">
                <div id="header-action-area"></div>
            </div>
        </div>
        
        <!-- CONTENT WRAPPER -->
        <div id="main-view" class="view-container">
            <!-- Loading view by default -->
            <div class="loading-container">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <!-- DOCUMENT SLIDEOVER -->
    <div id="modal-backdrop" class="modal-backdrop" onclick="closeModal()"></div>
    <div id="detail-modal" class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Document Inspector</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <pre><code id="json-viewer"></code></pre>
            <div id="modal-actions" style="margin-top: 24px; display: flex; gap: 12px;">
                <!-- Filled dynamically -->
            </div>
        </div>
    </div>

    <!-- APPLICATION SCRIPTS -->
    <script>
        const API_BASE = '/api/typesense-admin';
        let currentCollection = null;
        let collectionsMap = {};
        
        let currentPage = 1;
        const limitPerPage = 10;
        let searchQuery = '';
        
        // Initial setup
        document.addEventListener('DOMContentLoaded', () => {
            refreshData();
        });
        
        function showLoading() {
            document.getElementById('main-view').innerHTML = `
                <div class="loading-container">
                    <div class="loader"></div>
                </div>
            `;
        }

        async function refreshData() {
            await fetchStatus();
            await fetchCollections();
            if (currentCollection) {
                viewCollection(currentCollection);
            } else {
                showHome();
            }
        }

        async function fetchStatus() {
            try {
                const res = await fetch(`${API_BASE}/stats`);
                if (!res.ok) throw new Error('API unreachable');
                const data = await res.json();
                
                // Typesense Status
                const dbBadge = document.getElementById('db-status-badge');
                const dbText = document.getElementById('db-status-text');
                if (data.typesense_status === 'ok') {
                    dbBadge.className = 'status-badge status-online';
                    dbText.textContent = 'Connected';
                } else {
                    dbBadge.className = 'status-badge status-offline';
                    dbText.textContent = 'Disconnected';
                }
                
                // Ollama Status
                const ollamaBadge = document.getElementById('ollama-status-badge');
                const ollamaText = document.getElementById('ollama-status-text');
                if (data.ollama_status === 'ok') {
                    ollamaBadge.className = 'status-badge status-online';
                    ollamaText.textContent = 'Connected';
                } else {
                    ollamaBadge.className = 'status-badge status-offline';
                    ollamaText.textContent = 'Offline';
                }
                
                return data;
            } catch (err) {
                console.error('Error fetching status:', err);
                document.getElementById('db-status-badge').className = 'status-badge status-offline';
                document.getElementById('db-status-text').textContent = 'Disconnected';
                document.getElementById('ollama-status-badge').className = 'status-badge status-offline';
                document.getElementById('ollama-status-text').textContent = 'Disconnected';
            }
        }

        async function fetchCollections() {
            try {
                const res = await fetch(`${API_BASE}/collections`);
                if (!res.ok) throw new Error();
                const collections = await res.json();
                
                collectionsMap = {};
                const listContainer = document.getElementById('collections-list');
                listContainer.innerHTML = '';
                
                if (collections.length === 0) {
                    listContainer.innerHTML = `<div class="empty-state" style="padding: 16px 0; font-size: 13px;">No collections initialized</div>`;
                    return;
                }
                
                collections.forEach(c => {
                    collectionsMap[c.name] = c;
                    const button = document.createElement('button');
                    button.className = `collection-btn ${currentCollection === c.name ? 'active' : ''}`;
                    button.onclick = () => viewCollection(c.name);
                    button.innerHTML = `
                        <span>${c.name}</span>
                        <span class="collection-count">${c.num_documents}</span>
                    `;
                    listContainer.appendChild(button);
                });
            } catch (err) {
                console.error('Error fetching collections:', err);
            }
        }

        async function showHome() {
            currentCollection = null;
            document.querySelectorAll('.collection-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('view-title').textContent = 'Typesense Engine Overview';
            document.getElementById('view-subtitle').textContent = 'Global configuration settings and service statuses.';
            document.getElementById('header-action-area').innerHTML = '';
            
            showLoading();
            const stats = await fetchStatus();
            
            if (!stats) {
                document.getElementById('main-view').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-title">Failed to connect to backend API</div>
                        <p class="empty-state-desc">Make sure the FastAPI server is running on the Windows host.</p>
                    </div>
                `;
                return;
            }
            
            const totalColls = Object.keys(collectionsMap).length;
            let totalDocs = 0;
            Object.values(collectionsMap).forEach(c => totalDocs += c.num_documents);
            
            document.getElementById('main-view').innerHTML = `
                <div class="grid-3">
                    <div class="card">
                        <div class="card-title">Typesense Server</div>
                        <div class="card-value">${stats.typesense_status === 'ok' ? 'ONLINE' : 'OFFLINE'}</div>
                        <div class="card-meta">Endpoint: ${stats.typesense_host}:${stats.typesense_port}</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Total Collections</div>
                        <div class="card-value">${totalColls}</div>
                        <div class="card-meta">Registered memory segments</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Total Documents</div>
                        <div class="card-value">${totalDocs}</div>
                        <div class="card-meta">Pre-computed indexed items</div>
                    </div>
                </div>
                
                <h3 style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 600; margin-bottom: 16px;">Active Embedding Configuration</h3>
                <div class="card" style="margin-bottom: 24px;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                        <div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Provider</div>
                            <div style="font-size: 16px; font-weight: 600; margin-top: 4px; color: var(--accent-cyan);">${stats.embedding_provider.toUpperCase()}</div>
                        </div>
                        <div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Model Name</div>
                            <div style="font-size: 16px; font-weight: 600; margin-top: 4px; color: var(--text-primary);">${stats.embedding_model}</div>
                        </div>
                        <div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Dimensions</div>
                            <div style="font-size: 16px; font-weight: 600; margin-top: 4px; color: var(--text-primary);">${stats.embedding_dimensions} floats</div>
                        </div>
                        <div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Ollama API</div>
                            <div style="font-size: 16px; font-weight: 600; margin-top: 4px; color: var(--text-primary);">${stats.ollama_host_url}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function viewCollection(name, activeTab = 'documents') {
            currentCollection = name;
            currentPage = 1;
            
            // Highlight sidebar button
            document.querySelectorAll('.collection-btn').forEach(btn => {
                if (btn.querySelector('span').textContent === name) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            const col = collectionsMap[name];
            document.getElementById('view-title').textContent = `${name}`;
            document.getElementById('view-subtitle').textContent = `Document count: ${col.num_documents} items`;
            
            // Register Action to Drop collection
            document.getElementById('header-action-area').innerHTML = `
                <button onclick="dropCollection('${name}')" class="btn btn-danger">Drop Collection</button>
            `;
            
            renderCollectionWorkspace(activeTab);
        }

        function renderCollectionWorkspace(activeTab) {
            const name = currentCollection;
            const schema = collectionsMap[name];
            
            let tabContentHTML = '';
            
            if (activeTab === 'documents') {
                tabContentHTML = `
                    <div class="browser-controls">
                        <div class="search-box">
                            <input type="text" id="search-input" value="${searchQuery}" onkeydown="handleSearchKey(event)" placeholder="Search documents (lexical or vector)..." class="search-input">
                        </div>
                        <div class="pagination">
                            <button id="prev-page-btn" onclick="changePage(-1)" class="pagination-btn">Previous</button>
                            <span id="page-indicator">Page ${currentPage}</span>
                            <button id="next-page-btn" onclick="changePage(1)" class="pagination-btn">Next</button>
                        </div>
                    </div>
                    <div id="documents-table-container">
                        <!-- Loaded dynamically -->
                        <div class="loading-container"><div class="loader"></div></div>
                    </div>
                `;
            } else {
                // Render fields schema list and raw JSON
                const fieldsRows = schema.fields.map(f => {
                    return `
                        <tr>
                            <td style="font-weight: 600; color: var(--accent-cyan);">${f.name}</td>
                            <td><span class="badge badge-indigo">${f.type}</span></td>
                            <td>${f.facet ? '<span class="badge badge-emerald">True</span>' : '<span class="badge badge-rose">False</span>'}</td>
                            <td>${f.index ? '<span class="badge badge-emerald">True</span>' : '<span class="badge badge-rose">False</span>'}</td>
                            <td>${f.optional ? '<span class="badge badge-emerald">True</span>' : '<span class="badge badge-rose">False</span>'}</td>
                        </tr>
                    `;
                }).join('');
                
                tabContentHTML = `
                    <h3 style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; margin-bottom: 12px;">Schema Fields Definition</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Field Name</th>
                                    <th>Data Type</th>
                                    <th>Facet</th>
                                    <th>Indexed</th>
                                    <th>Optional</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${fieldsRows}
                            </tbody>
                        </table>
                    </div>
                    
                    <h3 style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; margin-bottom: 12px;">Raw JSON Schema</h3>
                    <pre><code class="language-json">${JSON.stringify(schema, null, 4)}</code></pre>
                `;
            }
            
            document.getElementById('main-view').innerHTML = `
                <div class="tabs-header">
                    <button class="tab-btn ${activeTab === 'documents' ? 'active' : ''}" onclick="switchTab('documents')">Documents</button>
                    <button class="tab-btn ${activeTab === 'schema' ? 'active' : ''}" onclick="switchTab('schema')">Schema & Fields</button>
                </div>
                <div id="tab-content">
                    ${tabContentHTML}
                </div>
            `;
            
            if (activeTab === 'documents') {
                fetchDocuments();
            }
        }

        function handleSearchKey(e) {
            if (e.key === 'Enter') {
                searchQuery = e.target.value;
                currentPage = 1;
                fetchDocuments();
            }
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            fetchDocuments();
        }

        async function fetchDocuments() {
            const name = currentCollection;
            const container = document.getElementById('documents-table-container');
            if (!container) return;
            
            container.innerHTML = `<div class="loading-container"><div class="loader"></div></div>`;
            
            try {
                const offset = (currentPage - 1) * limitPerPage;
                let url = `${API_BASE}/collections/${name}/documents?limit=${limitPerPage}&offset=${offset}`;
                if (searchQuery) {
                    url += `&q=${encodeURIComponent(searchQuery)}`;
                }
                
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                const docs = data.documents || [];
                const total = data.total || 0;
                
                // Update pagination buttons
                document.getElementById('page-indicator').textContent = `Page ${currentPage} (of ${Math.max(1, Math.ceil(total / limitPerPage))})`;
                document.getElementById('prev-page-btn').disabled = (currentPage === 1);
                document.getElementById('next-page-btn').disabled = (offset + limitPerPage >= total);
                
                if (docs.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="padding: 40px 0;">
                            <div class="empty-state-title">No documents found</div>
                            <p class="empty-state-desc">${searchQuery ? 'Try clearing your search query filter' : 'No records exist in this collection segment'}</p>
                        </div>
                    `;
                    return;
                }
                
                // Get header columns dynamically based on schema
                const schema = collectionsMap[name];
                const colsToShow = schema.fields.map(f => f.name).filter(col => col !== 'embedding');
                
                const headerColsHTML = colsToShow.map(col => `<th>${col.toUpperCase()}</th>`).join('') + `<th>EMBEDDING</th><th>ACTIONS</th>`;
                
                const rowsHTML = docs.map(doc => {
                    const cellsHTML = colsToShow.map(col => {
                        const val = doc[col];
                        return `<td title="${val !== undefined ? val : ''}">${val !== undefined ? val : '<span style="color: var(--text-muted)">None</span>'}</td>`;
                    }).join('');
                    
                    const emb = doc.embedding;
                    let embText = '<span style="color: var(--text-muted)">None</span>';
                    if (Array.isArray(emb) && emb.length > 0) {
                        embText = `<span class="badge badge-cyan">[${emb[0].toFixed(2)}, ...] (${emb.length} dim)</span>`;
                    }
                    
                    return `
                        <tr>
                            ${cellsHTML}
                            <td>${embText}</td>
                            <td>
                                <button onclick="viewDocument('${doc.id}')" class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;">View JSON</button>
                                <button onclick="deleteDocument('${doc.id}')" class="btn btn-danger" style="padding: 4px 8px; font-size: 11px;">Delete</button>
                            </td>
                        </tr>
                    `;
                }).join('');
                
                container.innerHTML = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    ${headerColsHTML}
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHTML}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<div class="empty-state" style="padding: 40px 0; color: var(--accent-rose);">Failed to load documents. Check server connections.</div>`;
            }
        }

        async function viewDocument(id) {
            const name = currentCollection;
            try {
                // Fetch document directly
                const res = await fetch(`${API_BASE}/collections/${name}/documents/${id}`);
                if (!res.ok) throw new Error();
                const doc = await res.json();
                
                // Format the document JSON. Truncate embedding for viewing readability
                const docCopy = {...doc};
                if (Array.isArray(docCopy.embedding)) {
                    docCopy.embedding = `[ ${docCopy.embedding.slice(0, 5).map(v => v.toFixed(4)).join(', ')}, ... (${docCopy.embedding.length} dimensions) ]`;
                }
                
                document.getElementById('json-viewer').textContent = JSON.stringify(docCopy, null, 4);
                
                document.getElementById('modal-actions').innerHTML = `
                    <button onclick="deleteDocument('${doc.id}'); closeModal();" class="btn btn-danger">Delete Document</button>
                    <button onclick="closeModal()" class="btn btn-secondary">Close</button>
                `;
                
                openModal();
            } catch (err) {
                alert(`Error loading document JSON: ${err}`);
            }
        }

        async function deleteDocument(id) {
            if (!confirm(`Are you sure you want to delete document ${id}?`)) return;
            const name = currentCollection;
            try {
                const res = await fetch(`${API_BASE}/collections/${name}/documents/${id}`, {
                    method: 'DELETE'
                });
                if (!res.ok) throw new Error();
                
                alert('Document successfully deleted.');
                refreshData();
            } catch (err) {
                alert(`Failed to delete document: ${err}`);
            }
        }

        async function dropCollection(name) {
            if (!confirm(`⚠️ DANGER: Are you sure you want to drop collection "${name}"?\nAll documents inside will be permanently deleted.`)) return;
            try {
                const res = await fetch(`${API_BASE}/collections/${name}`, {
                    method: 'DELETE'
                });
                if (!res.ok) throw new Error();
                
                alert(`Collection "${name}" dropped.`);
                currentCollection = null;
                refreshData();
            } catch (err) {
                alert(`Failed to drop collection: ${err}`);
            }
        }

        function openModal() {
            document.getElementById('modal-backdrop').classList.add('open');
            document.getElementById('detail-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.remove('open');
            document.getElementById('detail-modal').classList.remove('open');
        }
    </script>
</body>
</html>
