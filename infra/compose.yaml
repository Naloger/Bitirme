services:
  # Memgraph: Graph Caching & Relationship Memory
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: memgraph-local
    ports:
      - "7687:7687" # Bolt connection
      - "3000:3000" # Memgraph Lab Web Client
    volumes:
      - memgraph-data:/var/lib/memgraph
    environment:
      - MEMGRAPH_EXTRA_ARGUMENTS=--log-level=WARNING
    restart: always

  # Typesense: High-Performance Vector & Text Search
  typesense:
    image: typesense/typesense:26.0
    container_name: typesense-local
    ports:
      - "8108:8108"
    volumes:
      - ./data/typesense:/data
    command:
      - --data-dir=/data
      - --api-key=local_rag_secret_key_123
      - --enable-cors
    restart: always

  # Kafka: Message Bus for Agentic decoupling
  kafka:
    image: apache/kafka:latest
    container_name: kafka-local
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    restart: always

volumes:
  memgraph-data:
