<html lang="en">

    <style>

        }
        .properties-detail {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .properties-detail p.placeholder {
            color: #64748b;
            font-style: italic;
            text-align: center;
            margin-top: 40px;
        }
        .detail-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

            font-size: 0.95rem;

        .controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(30, 41, 59, 0.85);

            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;

        .btn {
            background-color: #3b82f6;
            color: #f1f5f9;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {

        .btn-secondary {
            background-color: #475569;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }

<body>
    <header>
        <div class="header-title">
            <h1>Apache AGE Graph Explorer</h1>
            <p>Interactive graph database schema visualization</p>
        </div>
        <div class="selector-container">
            <label for="graph-selector">Select Graph:</label>
            <select id="graph-selector" onchange="loadSelectedGraph()">
                <!-- Graphs will be dynamically populated -->
            </select>
        </div>
    </header>

    <div class="app-container">
        <div id="network-container"></div>
        
        <div class="controls-panel">
            <button class="btn" id="physics-btn" onclick="togglePhysics()">Pause Physics</button>
            <button class="btn btn-secondary" onclick="fitNetwork()">Zoom Fit</button>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <h2>📊 Graph Info</h2>
                <div class="meta-grid">
                    <div class="meta-card">
                        <div class="num" id="node-count">0</div>
                        <div class="label">Nodes</div>
                    </div>
                    <div class="meta-card">
                        <div class="num" id="edge-count">0</div>
                        <div class="label">Edges</div>
                    </div>
                </div>
            </div>
            <div class="properties-detail" id="detail-pane">
                <h2>🔍 Selection Detail</h2>
                <p class="placeholder">Click on a node or edge to inspect properties</p>
            </div>
        </div>
    </div>

    <script>
        const rawData = {"keyword_db / keyword_graph": {"nodes": [{"id": "844424930131969", "labels": ["Keyword"], "properties": {"word": "attention", "sqlite_id": 1}}, {"id": "844424930131970", "labels": ["Keyword"], "properties": {"word": "transformer", "sqlite_id": 2}}, {"id": "844424930131971", "labels": ["Keyword"], "properties": {"word": "llm", "sqlite_id": 3}}, {"id": "844424930131972", "labels": ["Keyword"], "properties": {"word": "bert", "sqlite_id": 4}}, {"id": "844424930131973", "labels": ["Keyword"], "properties": {"word": "gpt", "sqlite_id": 5}}, {"id": "844424930131974", "labels": ["Keyword"], "properties": {"word": "embedding", "sqlite_id": 6}}, {"id": "844424930131975", "labels": ["Keyword"], "properties": {"word": "vector", "sqlite_id": 7}}, {"id": "844424930131976", "labels": ["Keyword"], "properties": {"word": "database", "sqlite_id": 8}}, {"id": "844424930131977", "labels": ["Keyword"], "properties": {"word": "rag", "sqlite_id": 9}}, {"id": "844424930131978", "labels": ["Keyword"], "properties": {"word": "retrieval", "sqlite_id": 10}}, {"id": "844424930131979", "labels": ["Keyword"], "properties": {"word": "prompt", "sqlite_id": 11}}, {"id": "844424930131980", "labels": ["Keyword"], "properties": {"word": "context", "sqlite_id": 12}}, {"id": "844424930131981", "labels": ["Keyword"], "properties": {"word": "token", "sqlite_id": 13}}, {"id": "844424930131982", "labels": ["Keyword"], "properties": {"word": "nlp", "sqlite_id": 14}}], "edges": [{"source": "844424930131969", "target": "844424930131970", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.8}}, {"source": "844424930131982", "target": "844424930131970", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.8}}, {"source": "844424930131970", "target": "844424930131971", "type": "CO_OCCUR_WITH", "properties": {"weight": 5.2}}, {"source": "844424930131982", "target": "844424930131971", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.6}}, {"source": "844424930131970", "target": "844424930131972", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.1}}, {"source": "844424930131971", "target": "844424930131973", "type": "CO_OCCUR_WITH", "properties": {"weight": 5.5}}, {"source": "844424930131974", "target": "844424930131975", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.6}}, {"source": "844424930131975", "target": "844424930131976", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.3}}, {"source": "844424930131971", "target": "844424930131977", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.9}}, {"source": "844424930131976", "target": "844424930131977", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.7}}, {"source": "844424930131977", "target": "844424930131978", "type": "CO_OCCUR_WITH", "properties": {"weight": 5.0}}, {"source": "844424930131973", "target": "844424930131979", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.4}}, {"source": "844424930131978", "target": "844424930131980", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.2}}, {"source": "844424930131979", "target": "844424930131980", "type": "CO_OCCUR_WITH", "properties": {"weight": 4.5}}, {"source": "844424930131971", "target": "844424930131981", "type": "CO_OCCUR_WITH", "properties": {"weight": 3.9}}]}, "memory_db / rdf_quadstore_graph": {"nodes": [{"id": "844424930131969", "labels": ["RDFResource"], "properties": {"uri": "http://example.org/resource/Python", "type": "iri"}}, {"id": "844424930131970", "labels": ["RDFResource"], "properties": {"uri": "http://example.org/ontology/ProgrammingLanguage", "type": "iri"}}, {"id": "844424930131971", "labels": ["RDFResource"], "properties": {"uri": "http://example.org/resource/RAG", "type": "iri"}}, {"id": "844424930131972", "labels": ["RDFResource"], "properties": {"uri": "http://example.org/ontology/AIArchitecture", "type": "iri"}}, {"id": "844424930131973", "labels": ["RDFResource"], "properties": {"uri": "http://example.org/resource/Transformers", "type": "iri"}}, {"id": "844424930131974", "labels": ["RDFResource"], "properties": {"uri": "http://example.org/ontology/SoftwareLibrary", "type": "iri"}}, {"id": "844424930131975", "labels": ["RDFResource"], "properties": {"uri": "http://example.org/user/alice", "type": "iri"}}, {"id": "844424930131976", "labels": ["RDFResource"], "properties": {"uri": "http://example.org/ontology/Person", "type": "iri"}}, {"id": "844424930131977", "labels": ["RDFResource"], "properties": {"uri": "http://example.org/user/bob", "type": "iri"}}, {"id": "1407374883553281", "labels": ["RDFLiteral"], "properties": {"lang": "en", "value": "Python Language", "datatype": "http://www.w3.org/2001/XMLSchema#string"}}, {"id": "1407374883553282", "labels": ["RDFLiteral"], "properties": {"lang": "en", "value": "Retrieval Augmented Generation", "datatype": "http://www.w3.org/2001/XMLSchema#string"}}, {"id": "1407374883553283", "labels": ["RDFLiteral"], "properties": {"lang": "en", "value": "HuggingFace Transformers", "datatype": "http://www.w3.org/2001/XMLSchema#string"}}, {"id": "1407374883553284", "labels": ["RDFLiteral"], "properties": {"lang": "en", "value": "Alice", "datatype": "http://www.w3.org/2001/XMLSchema#string"}}, {"id": "1407374883553285", "labels": ["RDFLiteral"], "properties": {"lang": "en", "value": "Bob", "datatype": "http://www.w3.org/2001/XMLSchema#string"}}], "edges": [{"source": "844424930131971", "target": "844424930131969", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/metadata", "predicate": "http://example.org/ontology/usesLibrary"}}, {"source": "844424930131975", "target": "844424930131969", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/users", "predicate": "http://example.org/ontology/likesSubject"}}, {"source": "844424930131969", "target": "844424930131970", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/metadata", "predicate": "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"}}, {"source": "844424930131975", "target": "844424930131971", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/users", "predicate": "http://example.org/ontology/likesSubject"}}, {"source": "844424930131971", "target": "844424930131972", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/metadata", "predicate": "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"}}, {"source": "844424930131971", "target": "844424930131973", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/metadata", "predicate": "http://example.org/ontology/usesLibrary"}}, {"source": "844424930131977", "target": "844424930131973", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/users", "predicate": "http://example.org/ontology/likesSubject"}}, {"source": "844424930131973", "target": "844424930131974", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/metadata", "predicate": "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"}}, {"source": "844424930131977", "target": "844424930131975", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/users", "predicate": "http://example.org/ontology/hasFriend"}}, {"source": "844424930131975", "target": "844424930131976", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/users", "predicate": "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"}}, {"source": "844424930131977", "target": "844424930131976", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/users", "predicate": "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"}}, {"source": "844424930131969", "target": "1407374883553281", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/metadata", "predicate": "http://www.w3.org/2000/01/rdf-schema#label"}}, {"source": "844424930131971", "target": "1407374883553282", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/metadata", "predicate": "http://www.w3.org/2000/01/rdf-schema#label"}}, {"source": "844424930131973", "target": "1407374883553283", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/metadata", "predicate": "http://www.w3.org/2000/01/rdf-schema#label"}}, {"source": "844424930131975", "target": "1407374883553284", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/users", "predicate": "http://www.w3.org/2000/01/rdf-schema#label"}}, {"source": "844424930131977", "target": "1407374883553285", "type": "RDF_EDGE", "properties": {"context": "http://example.org/context/users", "predicate": "http://www.w3.org/2000/01/rdf-schema#label"}}]}};
        let network = null;
        let physicsEnabled = true;

        // Populate Graph Select dropdown
        const selector = document.getElementById("graph-selector");
        Object.keys(rawData).forEach(key => {
            const opt = document.createElement("option");
            opt.value = key;
            opt.innerText = key;
            selector.appendChild(opt);
        });

        // Color palettes
        const COLORS = {
            Keyword: { background: "#14b8a6", border: "#0d9488", highlight: { background: "#2dd4bf", border: "#14b8a6" } }, // Teal
            RDFResource: { background: "#3b82f6", border: "#2563eb", highlight: { background: "#60a5fa", border: "#3b82f6" } }, // Blue
            RDFLiteral: { background: "#f59e0b", border: "#d97706", highlight: { background: "#fbbf24", border: "#f59e0b" } }, // Amber
            Concept: { background: "#ec4899", border: "#db2777", highlight: { background: "#f472b6", border: "#ec4899" } }, // Pink
            default: { background: "#64748b", border: "#475569", highlight: { background: "#94a3b8", border: "#64748b" } } // Slate
        };

        function shortenUri(uri) {
            if (!uri) return "";
            try {
                const url = new URL(uri);
                // Return short namespace:localName or just pathname end
                const pathParts = url.pathname.split('/');
                const lastPart = pathParts[pathParts.length - 1];
                if (url.hash) {
                    return url.hash.substring(1);
                }
                return lastPart || url.hostname;
            } catch (e) {
                // If it's a blank node or not a URL
                return uri.length > 25 ? uri.substring(0, 25) + "..." : uri;
            }
        }

        function loadSelectedGraph() {
            const key = selector.value;
            if (!key || !rawData[key]) return;

            const graph = rawData[key];
            
            // Update UI metadata
            document.getElementById("node-count").innerText = graph.nodes.length;
            document.getElementById("edge-count").innerText = graph.edges.length;
            resetDetailPane();

            // Transform Nodes
            const visNodes = graph.nodes.map(n => {
                const labelType = n.labels[0] || "default";
                const palette = COLORS[labelType] || COLORS.default;
                
                // Label string based on type
                let displayLabel = "";
                let title = n.labels.join(", ");
                
                if (labelType === "Keyword") {
                    displayLabel = n.properties.word || `Node ${n.id}`;
                } else if (labelType === "RDFResource") {
                    displayLabel = shortenUri(n.properties.uri) || `Resource ${n.id}`;
                    title += `\nURI: ${n.properties.uri}`;
                } else if (labelType === "RDFLiteral") {
                    displayLabel = n.properties.value;
                    if (displayLabel && displayLabel.length > 15) {
                        displayLabel = displayLabel.substring(0, 15) + "...";
                    }
                    title += `\nValue: ${n.properties.value}\nDatatype: ${n.properties.datatype || "string"}`;
                    if (n.properties.lang) title += `\nLang: ${n.properties.lang}`;
                } else {
                    displayLabel = n.properties.name || n.properties.label || `Node ${n.id}`;
                }

                return {
                    id: n.id,
                    label: displayLabel,
                    title: title,
                    color: palette,
                    shape: labelType === "RDFLiteral" ? "box" : "dot",
                    size: labelType === "RDFLiteral" ? 20 : 16,
                    font: { color: "#f1f5f9", size: 12 },
                    rawData: n
                };
            });

            // Transform Edges
            const visEdges = graph.edges.map((e, idx) => {
                let displayLabel = e.type || "";
                let weight = 1;
                let title = `Type: ${e.type}`;

                // Extract PPMI co-occurrence weights
                if (e.properties && e.properties.weight !== undefined) {
                    weight = parseFloat(e.properties.weight);
                    displayLabel = `${displayLabel} (${weight.toFixed(2)})`;
                    title += `\nWeight: ${weight}`;
                }
                
                // Extract RDF predicate
                if (e.properties && e.properties.predicate) {
                    displayLabel = shortenUri(e.properties.predicate);
                    title += `\nPredicate: ${e.properties.predicate}`;
                    if (e.properties.context) title += `\nContext/Graph: ${e.properties.context}`;
                }

                return {
                    id: `edge_${idx}`,
                    from: e.source,
                    to: e.target,
                    label: displayLabel,
                    title: title,
                    arrows: (e.type === "CO_OCCUR_WITH") ? "" : "to", // Undirected for co-occurrences, directed for RDF/Concepts
                    width: Math.min(Math.max(weight * 1.5, 1), 6),
                    color: { color: "#475569", highlight: "#3b82f6", hover: "#60a5fa" },
                    font: { color: "#94a3b8", size: 10, strokeWidth: 0, align: "horizontal" },
                    rawData: e
                };
            });

            const container = document.getElementById("network-container");
            const data = {
                nodes: new vis.DataSet(visNodes),
                edges: new vis.DataSet(visEdges)
            };

            const options = {
                nodes: {
                    borderWidth: 2,
                    scaling: { min: 10, max: 30 }
                },
                edges: {
                    smooth: {
                        type: "continuous",
                        roundness: 0.5
                    }
                },
                physics: {
                    enabled: true,
                    stabilization: {
                        enabled: true,
                        iterations: 150
                    },
                    barnesHut: {
                        gravitationalConstant: -3000,
                        centralGravity: 0.3,
                        springLength: 120,
                        springConstant: 0.04,
                        damping: 0.09
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200
                }
            };

            if (network) {
                network.destroy();
            }

            network = new vis.Network(container, data, options);
            physicsEnabled = true;
            document.getElementById("physics-btn").innerText = "Pause Physics";
            document.getElementById("physics-btn").classList.remove("btn-secondary");

            // Register click handlers
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const clickedNodeId = params.nodes[0];
                    const nodeData = data.nodes.get(clickedNodeId);
                    showNodeDetails(nodeData.rawData);
                } else if (params.edges.length > 0) {
                    const clickedEdgeId = params.edges[0];
                    const edgeData = data.edges.get(clickedEdgeId);
                    showEdgeDetails(edgeData.rawData);
                } else {
                    resetDetailPane();
                }
            });
        }

        function showNodeDetails(node) {
            const pane = document.getElementById("detail-pane");
            
            let labelBadges = node.labels.map(l => `<span class="label-badge">${l}</span>`).join(" ");
            
            let propsHtml = "";
            Object.keys(node.properties).forEach(k => {
                propsHtml += `
                    <div class="prop-row">
                        <span class="prop-key">${k}</span>
                        <span class="prop-val">${node.properties[k]}</span>
                    </div>
                `;
            });

            pane.innerHTML = `
                <h2>🔍 Selection Detail</h2>
                <div class="detail-card">
                    <div class="detail-header">
                        <h3>Node properties</h3>
                        <div>${labelBadges}</div>
                    </div>
                    <div class="prop-row">
                        <span class="prop-key">internal_id</span>
                        <span class="prop-val">${node.id}</span>
                    </div>
                    ${propsHtml}
                </div>
            `;
        }

        function showEdgeDetails(edge) {
            const pane = document.getElementById("detail-pane");
            
            let propsHtml = "";
            Object.keys(edge.properties).forEach(k => {
                propsHtml += `
                    <div class="prop-row">
                        <span class="prop-key">${k}</span>
                        <span class="prop-val">${edge.properties[k]}</span>
                    </div>
                `;
            });

            pane.innerHTML = `
                <h2>🔍 Selection Detail</h2>
                <div class="detail-card">
                    <div class="detail-header">
                        <h3>Relationship Property</h3>
                        <span class="label-badge">${edge.type}</span>
                    </div>
                    <div class="prop-row">
                        <span class="prop-key">Source ID</span>
                        <span class="prop-val">${edge.source}</span>
                    </div>
                    <div class="prop-row">
                        <span class="prop-key">Target ID</span>
                        <span class="prop-val">${edge.target}</span>
                    </div>
                    ${propsHtml}
                </div>
            `;
        }

        function resetDetailPane() {
            document.getElementById("detail-pane").innerHTML = `
                <h2>🔍 Selection Detail</h2>
                <p class="placeholder">Click on a node or edge to inspect properties</p>
            `;
        }

        function togglePhysics() {
            if (!network) return;
            physicsEnabled = !physicsEnabled;
            network.setOptions({ physics: { enabled: physicsEnabled } });
            
            const btn = document.getElementById("physics-btn");
            if (physicsEnabled) {
                btn.innerText = "Pause Physics";
                btn.classList.remove("btn-secondary");
            } else {
                btn.innerText = "Resume Physics";
                btn.classList.add("btn-secondary");
            }
        }

        function fitNetwork() {
            if (network) {
                network.fit({ animation: { duration: 500, easingFunction: "easeOutQuad" } });
            }
        }

        // Initialize first graph
        loadSelectedGraph();
    </script>
</body>
</html>
